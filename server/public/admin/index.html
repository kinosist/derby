<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>derby 管理ページ</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="banner" class="banner" hidden>再接続中…</div>

  <form id="login" class="login" hidden>
    <h1>derby 管理ページ</h1>
    <label for="key">先生用パスワード</label>
    <input id="key" type="password" autocomplete="current-password" autofocus>
    <p id="loginError" class="login-error" role="alert"></p>
    <button type="submit" class="primary">入る</button>
  </form>

  <div id="app" class="app" hidden>
    <header class="top">
      <div id="raceLabel" class="race-label"></div>
      <div id="phaseLabel" class="phase-label"></div>
      <div id="countLabel" class="count-label"></div>
    </header>

    <main id="stage" class="stage"></main>

    <aside class="side">
      <h2>順位表 <span id="playerCount"></span></h2>
      <ol id="board" class="board"></ol>
    </aside>

    <footer class="bottom">
      <div class="danger-buttons">
        <button id="resetBtn" class="quiet">試合をリセット</button>
        <button id="kickAllBtn" class="quiet">全員を退出させる</button>
      </div>
      <p id="toast" class="toast" role="status"></p>
      <button id="mainBtn" class="primary big"></button>
    </footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
